<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis · 站点控制台</title>
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="mark">616</span>
        <span class="brand-text">
          <span class="name">JARVIS</span>
          <span class="sub">站点控制台 · SITE CONSOLE</span>
        </span>
      </div>

      <button id="toggle-tree" class="btn btn-icon" type="button" title="显示 / 隐藏文件树">
        ☰
      </button>

      <div class="path" id="path">未选择文件</div>
      <div class="meta" id="meta"></div>

      <div class="actions">
        <span id="status" class="status">未加载</span>
        <button id="open-site" class="btn" type="button">站点 ↗</button>
        <button id="save" class="btn btn-primary" type="button">保存 <kbd>⌘S</kbd></button>
      </div>
    </header>

    <main class="split" id="split">
      <aside class="tree-pane" id="tree-pane">
        <div class="pane-head">
          <span>文件</span>
          <span class="hint">⌘P 快速打开</span>
        </div>
        <div class="tree" id="tree"></div>
      </aside>

      <section class="pane preview-pane">
        <div class="pane-head">
          <span id="preview-title">预览</span>
          <span class="hint" id="preview-hint"></span>
        </div>
        <iframe id="preview" title="预览" src="/preview.html"></iframe>

      </section>

      <div
        class="divider"
        id="divider"
        role="separator"
        aria-orientation="vertical"
        tabindex="0"
      >
        <span class="grip" aria-hidden="true"></span>
      </div>

      <section class="pane editor-pane">
        <div class="pane-head">
          <span id="file-label">未选择文件</span>
          <span class="hint" id="count"></span>
        </div>
        <div class="code">
          <pre class="gutter" id="gutter" aria-hidden="true"></pre>
          <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
        </div>
      </section>
    </main>

    <div class="palette" id="palette" hidden>
      <div class="palette-box" role="dialog" aria-label="快速打开文件">
        <input id="palette-input" type="text" placeholder="输入路径或文件名…" autocomplete="off" />
        <ul id="palette-list"></ul>
        <div class="palette-foot">
          <span>↑↓ 选择</span><span>↵ 打开</span><span>esc 关闭</span>
        </div>
      </div>
    </div>

    <script src="/editor.js"></script>
  </body>
</html>
